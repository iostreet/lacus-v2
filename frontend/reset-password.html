<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lacus — Reset Password</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/static/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent:  #a855f7;
      --accent2: #7c3aed;
      --white:   #ffffff;
      --gray2:   #94a3b8;
      --gray3:   #475569;
      --bg:      #000;
      --border:  rgba(255,255,255,0.08);
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--white);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #0c0c16; border: 1px solid rgba(168,85,247,0.25);
      border-radius: 20px; padding: 44px 40px; width: 100%; max-width: 420px;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .logo span { font-size: 1.3rem; font-weight: 800; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
    .sub { font-size: 0.88rem; color: var(--gray2); margin-bottom: 28px; line-height: 1.55; }
    .field { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    input {
      padding: 12px 15px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      color: var(--white); font-size: 0.9rem; outline: none;
      transition: border-color 0.2s; font-family: inherit; width: 100%;
    }
    input:focus { border-color: rgba(168,85,247,0.5); }
    input::placeholder { color: var(--gray3); }
    button.submit {
      width: 100%; padding: 13px; background: var(--accent); color: var(--white);
      border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s; font-family: inherit;
    }
    button.submit:hover { background: var(--accent2); }
    button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      border-radius: 8px; padding: 11px 14px; font-size: 0.85rem;
      line-height: 1.5; margin-bottom: 16px; display: none;
    }
    .msg.error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.25);  color: #f87171; }
    .msg.success { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.25);  color: #4ade80; }
    .msg.show { display: block; }
    .back { text-align: center; margin-top: 18px; font-size: 0.82rem; color: var(--gray2); }
    .back a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .back a:hover { text-decoration: underline; }
    .loading-state { text-align: center; padding: 20px 0; color: var(--gray2); font-size: 0.9rem; }
    .invalid-state { text-align: center; padding: 10px 0; }
    .invalid-state p { color: var(--gray2); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.6; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" width="28" height="28">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
    </svg>
    <span>Lacus</span>
  </div>

  <div id="loading-state" class="loading-state">Verifying reset link…</div>

  <div id="reset-form" style="display:none">
    <h1>Set new password</h1>
    <p class="sub">Choose a strong password for your account.</p>
    <div class="msg error" id="err"></div>
    <div class="msg success" id="ok"></div>
    <div class="field">
      <input type="password" id="pw1" placeholder="New password (min 8 characters)" minlength="8" autocomplete="new-password" />
      <input type="password" id="pw2" placeholder="Confirm new password" minlength="8" autocomplete="new-password" />
    </div>
    <button class="submit" id="submit-btn" onclick="doReset()">Update Password</button>
    <div class="back"><a href="/">← Back to home</a></div>
  </div>

  <div id="invalid-state" style="display:none" class="invalid-state">
    <h1 style="margin-bottom:12px">Link expired</h1>
    <p>This password reset link has expired or is invalid. Please request a new one.</p>
    <a href="/" style="display:inline-block;padding:12px 28px;background:var(--accent);color:#fff;border-radius:10px;font-weight:700;text-decoration:none">Go to Home</a>
  </div>
</div>

<script>
(function () {
  const SUPABASE_URL  = 'https://pzodkufrnnjkbghyfwth.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6b2RrdWZybm5qa2JnaHlmd3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzg2ODAsImV4cCI6MjA5MjgxNDY4MH0.Z_WF2-VVFKTiGF2V4DEcabZYgdxeW_feO4eqcfu1rqU';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  let recoverySession = null;

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      recoverySession = session;
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('reset-form').style.display = 'block';
    }
  });

  // Timeout: if no PASSWORD_RECOVERY event fires in 4s, the link is invalid/expired
  setTimeout(() => {
    if (!recoverySession && document.getElementById('reset-form').style.display === 'none') {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('invalid-state').style.display = 'block';
    }
  }, 4000);

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg; el.classList.add('show');
    document.getElementById('ok').classList.remove('show');
  }
  function showOk(msg) {
    const el = document.getElementById('ok');
    el.textContent = msg; el.classList.add('show');
    document.getElementById('err').classList.remove('show');
  }

  window.doReset = async function () {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;

    if (pw1.length < 8) { showErr('Password must be at least 8 characters.'); return; }
    if (pw1 !== pw2)    { showErr('Passwords do not match.'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Updating…';

    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) {
      showErr(error.message);
      btn.disabled = false; btn.textContent = 'Update Password';
      return;
    }
    showOk('Password updated! Redirecting…');
    btn.disabled = true;
    setTimeout(() => { window.location.href = '/app'; }, 1800);
  };
})();
</script>
</body>
</html>
